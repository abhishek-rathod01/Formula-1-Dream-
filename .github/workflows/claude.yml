name: Claude Code

# Mention @claude in an issue or PR comment and Claude picks it up.
#
# BILLING -- read before enabling:
#   CLAUDE_CODE_OAUTH_TOKEN draws on your Claude Pro/Max subscription.
#     Generate it locally with:  claude setup-token
#   ANTHROPIC_API_KEY draws on separate API credit, billed independently of
#     the subscription. Only fall back to it if the OAuth token is unavailable.
#   Set whichever you use as a repo secret:
#     gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo <owner>/<repo>
#
# This workflow also requires the Claude GitHub App installed on the repo:
#   https://github.com/apps/claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run for the repo owner, and only when @claude is actually mentioned.
    # The owner check matters on public repos: without it, any drive-by
    # commenter could spend your Claude usage.
    if: |
      github.event.sender.login == github.repository_owner &&
      (
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.review.body, '@claude') ||
        contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Fallback if you prefer API-credit billing -- use ONE of these:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 15
